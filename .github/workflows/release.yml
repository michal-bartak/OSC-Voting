name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (v0.1.0 or 0.1.0; must exist on GitHub and match VERSION)"
        required: true
      draft:
        description: "Create as draft release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.normalize.outputs.tag }}
    steps:
      - name: Normalize tag input
        id: normalize
        run: |
          raw="${{ inputs.tag }}"
          if [[ "$raw" == v* ]]; then tag="$raw"; else tag="v$raw"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $tag"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.normalize.outputs.tag }}
      - name: Verify tag matches VERSION file
        run: |
          expected="v$(tr -d ' \n\r' < VERSION)"
          tag="${{ steps.normalize.outputs.tag }}"
          if [ "$tag" != "$expected" ]; then
            echo "Tag $tag does not match VERSION file ($expected)"; exit 1
          fi
          echo "Tag matches VERSION: $expected"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
            goos: linux
          - os: windows-latest
            platform: windows/amd64
            goos: windows
          - os: macos-latest
            platform: darwin/universal
            goos: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Sync wails.json version from VERSION file
        shell: bash
        run: |
          version=$(tr -d ' \n\r' < VERSION)
          jq --arg v "$version" '.info.productVersion = $v' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json
          echo "Set wails.json productVersion → $version"

      - name: Build
        run: wails build -platform ${{ matrix.platform }} -clean

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $out = "OSC-Vote-v${version}-windows-amd64.zip"
          Compress-Archive -Path "build\bin\OSC Vote.exe" -DestinationPath $out

      - name: List build output (macOS)
        if: runner.os == 'macOS'
        run: find build/bin -maxdepth 2 | sort

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          version=$(tr -d ' \n\r' < VERSION)
          app=$(find build/bin -maxdepth 1 -name "*.app" -type d | head -1)
          [ -n "$app" ] || { echo "ERROR: no .app bundle found in build/bin"; exit 1; }
          echo "Packaging: $app"
          cd build/bin && zip -r "../../OSC-Vote-v${version}-darwin-universal.zip" "$(basename "$app")"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          version=$(tr -d ' \n\r' < VERSION)
          zip -j "OSC-Vote-v${version}-linux-amd64.zip" "build/bin/OSC Vote"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}
          path: "OSC-Vote-v*.zip"
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          body: |
            ### Installing

            - **macOS:** First launch requires **Right-click → Open** (unsigned build).
            - **Windows:** SmartScreen may warn; choose **More info → Run anyway**.
            - **Linux:** Install runtime libs `libgtk-3-0` and `libwebkit2gtk-4.1-0` if needed.
          files: dist/*
