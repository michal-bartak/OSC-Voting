name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (v0.1.0 or 0.1.0; must exist on GitHub and match VERSION)"
        required: true
      draft:
        description: "Create as draft release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.normalize.outputs.tag }}
    steps:
      - name: Normalize tag input
        id: normalize
        run: |
          raw="${{ inputs.tag }}"
          if [[ "$raw" == v* ]]; then tag="$raw"; else tag="v$raw"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $tag"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.normalize.outputs.tag }}
      - name: Verify tag matches VERSION file
        run: |
          expected="v$(tr -d ' \n\r' < VERSION)"
          tag="${{ steps.normalize.outputs.tag }}"
          if [ "$tag" != "$expected" ]; then
            echo "Tag $tag does not match VERSION file ($expected)"; exit 1
          fi
          echo "Tag matches VERSION: $expected"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            goos: linux
          - os: windows-latest
            platform: windows/amd64
            goos: windows
          - os: macos-latest
            platform: darwin/universal
            goos: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # WebKit 4.1 dev headers (Ubuntu 24.04+); pairs with build:tags in wails.json
      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Sync wails.json version from VERSION file
        shell: bash
        run: |
          version=$(tr -d ' \n\r' < VERSION)
          jq --arg v "$version" '.info.productVersion = $v' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json
          echo "Set wails.json productVersion → $version"

      # build:tags webkit2_41 in wails.json selects webkit2gtk-4.1 at link time
      - name: Build
        run: wails build -platform ${{ matrix.platform }} -clean

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output  = (jq -r '.outputfilename' wails.json)
          $version = (Get-Content VERSION -Raw).Trim()
          Compress-Archive -Path "build\bin\$output.exe" -DestinationPath "$output-v$version-windows-amd64.zip"

      - name: Fix icon and re-sign (macOS)
        if: runner.os == 'macOS'
        run: |
          app=$(find build/bin -maxdepth 1 -name "*.app" -type d | head -1)
          [ -n "$app" ] || { echo "ERROR: no .app bundle found"; exit 1; }
          # Wails generates a single-size icns; replace with full multi-size set
          SRC="build/appicon.png"
          ICONSET="$(mktemp -d)/app.iconset"
          mkdir -p "$ICONSET"
          sips -z 16   16   "$SRC" --out "$ICONSET/icon_16x16.png"      > /dev/null
          sips -z 32   32   "$SRC" --out "$ICONSET/icon_16x16@2x.png"   > /dev/null
          sips -z 32   32   "$SRC" --out "$ICONSET/icon_32x32.png"      > /dev/null
          sips -z 64   64   "$SRC" --out "$ICONSET/icon_32x32@2x.png"   > /dev/null
          sips -z 128  128  "$SRC" --out "$ICONSET/icon_128x128.png"    > /dev/null
          sips -z 256  256  "$SRC" --out "$ICONSET/icon_128x128@2x.png" > /dev/null
          sips -z 256  256  "$SRC" --out "$ICONSET/icon_256x256.png"    > /dev/null
          sips -z 512  512  "$SRC" --out "$ICONSET/icon_256x256@2x.png" > /dev/null
          sips -z 512  512  "$SRC" --out "$ICONSET/icon_512x512.png"    > /dev/null
          cp "$SRC"           "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o "$app/Contents/Resources/iconfile.icns"
          echo "Icon rebuilt: $(ls -lh "$app/Contents/Resources/iconfile.icns" | awk '{print $5}')"
          # Re-sign outer bundle only (no --deep, which removes the nested binary)
          codesign --force --sign - "$app"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          output=$(jq -r '.outputfilename' wails.json)
          version=$(tr -d ' \n\r' < VERSION)
          app=$(find build/bin -maxdepth 1 -name "*.app" -type d | head -1)
          [ -n "$app" ] || { echo "ERROR: no .app bundle found in build/bin"; exit 1; }
          appname="$(basename "$app")"

          # Remove any stale darwin zip from earlier builds
          rm -f "$output"-v*-darwin-universal.zip

          # 1. Generate background image: dark background + grey arrow
          pip3 install --quiet --break-system-packages Pillow
          printf '%s\n' \
            'from PIL import Image, ImageDraw' \
            'W, H = 540, 440' \
            'img = Image.new("RGBA", (W, H), (255, 212, 160, 255))' \
            'draw = ImageDraw.Draw(img)' \
            'TRI_W, TRI_H, TRI_GAP, TRI_N = 15, 17, 8, 5' \
            'arrow_color = (255, 85, 0, 229)' \
            'start_x = (209 + 331) / 2 - (TRI_N * TRI_W + (TRI_N-1) * TRI_GAP) / 2' \
            'cy = 185' \
            '[draw.polygon([(start_x+i*(TRI_W+TRI_GAP), cy-TRI_H/2), (start_x+i*(TRI_W+TRI_GAP)+TRI_W, cy), (start_x+i*(TRI_W+TRI_GAP), cy+TRI_H/2)], fill=arrow_color) for i in range(TRI_N)]' \
            'img.convert("RGB").save("/tmp/dmg-background.png")' \
            > /tmp/gen_bg.py
          python3 /tmp/gen_bg.py

          # 2. Stage: app bundle + Applications symlink + hidden background folder
          staging=$(mktemp -d)
          cp -r "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          mkdir "$staging/.background"
          cp /tmp/dmg-background.png "$staging/.background/background.png"

          # 3. Create writable DMG
          hdiutil create -volname "OSC Voting" -srcfolder "$staging" \
            -ov -format UDRW -size 200m /tmp/osc-rw.dmg

          # 4. Mount
          hdiutil attach -readwrite -noverify /tmp/osc-rw.dmg | tee /tmp/hdiutil-attach.txt
          device=$(grep "^/dev/disk" /tmp/hdiutil-attach.txt | head -1 | awk '{print $1}')
          echo "Mounted as: $device"
          [ -n "$device" ] || { echo "ERROR: could not determine device"; exit 1; }
          sleep 3

          # 5. Set window layout via Finder AppleScript
          osascript \
            -e 'tell application "Finder"' \
            -e '  tell disk "OSC Voting"' \
            -e '    open' \
            -e '    set current view of container window to icon view' \
            -e '    set toolbar visible of container window to false' \
            -e '    set statusbar visible of container window to false' \
            -e '    set bounds of container window to {200, 100, 740, 540}' \
            -e '    set theViewOptions to icon view options of container window' \
            -e '    set arrangement of theViewOptions to not arranged' \
            -e '    set icon size of theViewOptions to 128' \
            -e '    set background picture of theViewOptions to file ".background:background.png"' \
            -e "    set position of item \"$appname\" of container window to {135, 185}" \
            -e '    set position of item "Applications" of container window to {405, 185}' \
            -e '    close' \
            -e '    open' \
            -e '    update without registering applications' \
            -e '    delay 3' \
            -e '    close' \
            -e '  end tell' \
            -e 'end tell'

          # 6. Unmount (sync first so Finder flushes; -force overrides EBUSY)
          sync
          hdiutil detach "$device" -force

          # 7. Convert to compressed read-only DMG
          hdiutil convert /tmp/osc-rw.dmg -format UDZO -imagekey zlib-level=9 \
            -o "$output-v$version-macos-universal.dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          output=$(jq -r '.outputfilename' wails.json)
          version=$(tr -d ' \n\r' < VERSION)
          binary="build/bin/$output"
          pkgname="osc-voting"
          description="Desktop voting app for the OneSynthChallenge"
          url="https://github.com/michal-bartak/OSC-Voting"
          maintainer="Michal Bartak <maxym.srpl@gmail.com>"

          # Install packaging tools
          sudo apt-get install -y --no-install-recommends rpm ruby-dev
          sudo gem install --no-document fpm

          # Generate .desktop file
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=OSC Voting' \
            'Comment=Vote on tracks in the OneSynthChallenge' \
            'Exec=/usr/bin/OSC-Voting' \
            'Icon=osc-voting' \
            'Categories=AudioVideo;Audio;' \
            > /tmp/osc-voting.desktop

          # Copy icon
          cp build/appicon.png /tmp/osc-voting.png

          # Build .deb — runtime deps must match the WebKit version linked at build time
          fpm -s dir -t deb \
            -n "$pkgname" -v "$version" \
            --description "$description" \
            --url "$url" \
            --maintainer "$maintainer" \
            --license "MIT" \
            --depends libgtk-3-0 \
            --depends libwebkit2gtk-4.1-0 \
            --architecture amd64 \
            --package "$output-v$version-linux-amd64.deb" \
            "$binary=/usr/bin/$output" \
            /tmp/osc-voting.desktop=/usr/share/applications/osc-voting.desktop \
            /tmp/osc-voting.png=/usr/share/icons/hicolor/256x256/apps/osc-voting.png

          # Build .rpm — runtime deps must match the WebKit version linked at build time
          fpm -s dir -t rpm \
            -n "$pkgname" -v "$version" \
            --description "$description" \
            --url "$url" \
            --maintainer "$maintainer" \
            --license "MIT" \
            --depends gtk3 \
            --depends webkit2gtk4.1 \
            --architecture x86_64 \
            --package "$output-v$version-linux-amd64.rpm" \
            "$binary=/usr/bin/$output" \
            /tmp/osc-voting.desktop=/usr/share/applications/osc-voting.desktop \
            /tmp/osc-voting.png=/usr/share/icons/hicolor/256x256/apps/osc-voting.png

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}
          path: "OSC-Voting-v*"
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          body: |
            ### Installing

            - **macOS:** Open the `.dmg`, drag **OSC Voting** to the Applications folder, then eject the disk image. The app is unsigned, so Gatekeeper will block it on first launch. Two ways to fix this:
              - **Recommended — download with curl** (no quarantine flag is set):
                ```
                curl -LJO https://github.com/michal-bartak/OSC-Voting/releases/download/${{ needs.prepare.outputs.tag }}/OSC-Voting-${{ needs.prepare.outputs.tag }}-macos-universal.dmg
                ```
              - **Already downloaded via browser** — run once in Terminal after dragging to Applications:
                ```
                xattr -d com.apple.quarantine /Applications/OSC-Voting.app
                ```
            - **Windows:** SmartScreen may warn; choose **More info → Run anyway**.
            - **Linux (Debian/Ubuntu):** `sudo apt install ./OSC-Voting-${{ needs.prepare.outputs.tag }}-linux-amd64.deb`
            - **Linux (Fedora/RHEL):** `sudo dnf install ./OSC-Voting-${{ needs.prepare.outputs.tag }}-linux-amd64.rpm`
          files: dist/*
